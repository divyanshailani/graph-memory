[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-graph-memory"
version = "3.8.1"
authors = [
  { name="Divyansh Ailani" },
]
description = "Local SQLite knowledge graph for AI coding agent memory — AST ingestion, trust decay, decision ledgers, contradiction detection, prompt-stable snapshots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agent-memory", "knowledge-graph", "mcp", "sqlite", "tree-sitter", "code-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
ast = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]
python = ["tree-sitter>=0.22.0", "tree-sitter-python>=0.25.0"]
typescript = ["tree-sitter>=0.22.0", "tree-sitter-typescript>=0.23.2"]
javascript = ["tree-sitter>=0.22.0", "tree-sitter-javascript>=0.25.0"]
go = ["tree-sitter>=0.22.0", "tree-sitter-go"]
rust = ["tree-sitter>=0.22.0", "tree-sitter-rust"]
http = ["mcp>=1.28,<2", "uvicorn>=0.23.0", "starlette>=0.27.0"]
all = [
    "mcp>=1.28,<2",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go",
    "tree-sitter-rust",
    "uvicorn>=0.23.0",
    "starlette>=0.27.0"
]

[project.urls]
Homepage = "https://github.com/divyanshailani/graph-memory"
Repository = "https://github.com/divyanshailani/graph-memory"
Changelog = "https://github.com/divyanshailani/graph-memory/blob/main/CHANGELOG.md"

[project.scripts]
graph-memory = "graph_memory.cli:main"
graph-memory-mcp = "graph_memory.mcp:main"
graph-memory-mcp-http = "graph_memory.mcp:main_http"
[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_query.py"
