name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all]' pytest
      - name: Compile Python sources
        run: python -m compileall -q graph_memory
      - name: Run tests
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Validate distribution with twine
        run: |
          python -m pip install twine
          twine check dist/*
      - name: Smoke test wheel (stdlib-only install)
        run: |
          python -m venv test-env
          test-env/bin/pip install dist/*.whl
          test-env/bin/python -c "import graph_memory; print('Import OK: core imports without mcp/tree-sitter')"
          test-env/bin/graph-memory --help >/dev/null
          echo "--- MCP entrypoint should degrade gracefully ---"
          if test-env/bin/graph-memory-mcp 2>&1 | grep -q "optional 'mcp' extra"; then
            echo "MCP install-hint OK"
          else
            echo "FAIL: MCP entrypoint did not print install hint"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
