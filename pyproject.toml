[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-graph-memory"
version = "3.7.0"
authors = [
  { name="Divyansh Ailani" },
]
description = "A universal, long-term project memory tool utilizing a local SQLite graph structure for AI agents."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.1.2",
    "tree-sitter>=0.22.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
python = ["tree-sitter-python"]
typescript = ["tree-sitter-typescript"]
javascript = ["tree-sitter-javascript"]
go = ["tree-sitter-go"]
rust = ["tree-sitter-rust"]
http = ["uvicorn>=0.23.0", "starlette>=0.27.0"]
all = [
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "uvicorn>=0.23.0",
    "starlette>=0.27.0"
]

[project.scripts]
graph-memory = "graph_memory.cli:main"
graph-memory-mcp = "graph_memory.mcp.server:main"
graph-memory-mcp-http = "graph_memory.mcp.http_server:main"
[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_query.py"
